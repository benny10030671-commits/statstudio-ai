[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "statstudio-ai"
version = "0.1.0"
description = "Local, independent statistics with an auditable AI tool interface"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4", "scipy==1.18.1", "pandas==3.0.6",
  "statsmodels==0.15.0", "scikit-learn==1.9.1",
  "fastapi==0.143.0", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "mcp==2.3.0", "openpyxl==3.1.5", "pyreadstat==1.3.6"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
statstudio = "statstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statstudio = ["static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

